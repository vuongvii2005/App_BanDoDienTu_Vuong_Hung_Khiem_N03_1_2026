spring.application.name=adminmobile
# ===== SERVER =====
server.port=8080
server.servlet.context-path=/

# ===== FIREBASE =====
firebase.service-account=classpath:serviceAccountKey.json
firebase.storage.bucket=your-project-id.appspot.com

# ===== SPRING SECURITY =====
# Admin credentials (đổi trước khi deploy)
admin.username=admin@shop.com
admin.password=Admin@123456

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ===== LOGGING =====
logging.level.com.admin=DEBUG
logging.level.com.google.firebase=WARN
logging.level.org.springframework.security=WARN

# ===== JACKSON =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null

# ===== MULTIPART (upload ảnh) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== CORS =====
app.cors.allowed-origins=*